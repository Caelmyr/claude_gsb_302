<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>求解器与参数 — 排程求解系统</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">排程求解系统</div>
    <div class="brand-sub">运筹优化与排程求解</div>
    <nav id="nav"></nav>
    <div class="section-label">问题实例</div>
    <select id="problem-picker"></select>
  </aside>
  <main class="main">
    <div class="page-head">
      <h1>求解器选择与参数</h1>
      <span class="sub">线性 / 整数规划与元启发式算法</span>
    </div>

    <div class="grid cols-3" id="solver-cards"></div>

    <div class="card">
      <div class="flex">
        <h2 style="margin:0" id="param-title">参数</h2>
        <div class="spacer"></div>
        <button class="btn primary" id="run-btn" onclick="run()">▶ 求解</button>
      </div>
      <div class="form-grid" id="param-fields"></div>
    </div>

    <div class="card" id="progress-card" style="display:none">
      <div class="flex">
        <h2 style="margin:0"><span id="pulse"></span><span id="progress-title">求解进度</span></h2>
        <div class="spacer"></div>
        <button class="btn danger" id="stop-btn" onclick="stopJob()">■ 停止</button>
      </div>
      <div class="progress-track" id="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="progress-meta">
        <span id="progress-explored">—</span>
        <span id="progress-eta">—</span>
      </div>
      <div class="grid cols-4" style="margin-top:12px">
        <div class="stat"><div class="label">当前最好目标值</div><div class="value" id="p-best">—</div></div>
        <div class="stat"><div class="label">下界</div><div class="value" id="p-lb">—</div></div>
        <div class="stat"><div class="label">已用时间</div><div class="value" id="p-elapsed">0s</div></div>
        <div class="stat"><div class="label">阶段</div><div class="value" style="font-size:16px" id="p-stage">—</div></div>
      </div>
      <p class="small muted" id="progress-msg" style="margin:8px 0 0"></p>
      <h3 class="small muted" style="margin:14px 0 6px">最好目标值随时间变化</h3>
      <div id="convergence"></div>
    </div>

    <div class="card" id="result-card" style="display:none">
      <h2>求解结果</h2>
      <div id="result-body"></div>
    </div>

    <div class="card">
      <h2>已保存的配置</h2>
      <table><thead><tr><th>ID</th><th>求解器</th><th>参数</th><th></th></tr></thead>
        <tbody id="config-rows"></tbody></table>
    </div>
  </main>
</div>
<script src="js/common.js"></script>
<script src="js/charts.js"></script>
<script>
let problem = null;
let defaults = {};
let selected = 'genetic';
let activeJob = null;
let pollTimer = null;
let lastChartPts = 0;

initSidebar('solvers.html');

// The solve keeps running server-side if the tab is closed; warn only so the
// user knows this page's live view will stop updating (the incumbent is still
// saved automatically on completion/stop).
window.addEventListener('beforeunload', (e) => {
  if (activeJob) { e.preventDefault(); e.returnValue = ''; }
});

async function load() {
  const id = currentProblemId();
  if (!id) return;
  problem = await api('/problems/' + id);
  const meta = await api('/solvers');
  defaults = meta.defaults;
  renderCards();
  renderParams();
  loadConfigs();
}

function renderCards() {
  document.getElementById('solver-cards').innerHTML = SOLVER_NAMES.map(n => `
    <div class="card" style="cursor:pointer;margin:0;border-width:2px;${n === selected ? 'border-color:var(--accent)' : ''}"
         onclick="select('${n}')">
      <h2 style="margin:0 0 4px">${escapeHtml(SOLVER_LABELS[n])}</h2>
      <div class="badge info">${n}</div>
      <p class="small muted" style="margin:8px 0 0">${description(n)}</p>
    </div>`).join('');
}

function description(n) {
  return {
    lp: '时间索引模型的线性规划松弛 —— 给出下界并还原出一个可行排程。',
    ip: '基于时间索引模型的精确分支定界求解。',
    genetic: '随机键编码的遗传算法，配合串行 SGS 解码。',
    simulated_annealing: '随机键编码的模拟退火，采用 Metropolis 接受准则。',
    greedy: '基于优先规则的确定性串行 SGS 基线。',
  }[n] || '';
}

function select(n) { selected = n; renderCards(); renderParams(); }

function renderParams() {
  document.getElementById('param-title').textContent = `参数 — ${SOLVER_LABELS[selected]}`;
  const params = defaults[selected] || {};
  const fields = document.getElementById('param-fields');
  fields.innerHTML = '';
  for (const [k, v] of Object.entries(params)) {
    const div = document.createElement('div');
    if (typeof v === 'boolean') {
      div.innerHTML = `<label>${escapeHtml(k)}</label>
        <input type="checkbox" id="param-${k}" ${v ? 'checked' : ''} style="width:auto">`;
    } else if (typeof v === 'number') {
      div.innerHTML = `<label>${escapeHtml(k)}</label>
        <input type="number" id="param-${k}" step="any" value="${v}">`;
    } else {
      div.innerHTML = `<label>${escapeHtml(k)}</label><input id="param-${k}" value="${escapeHtml(v)}">`;
    }
    fields.appendChild(div);
  }
}

function collectParams() {
  const params = {};
  for (const [k, v] of Object.entries(defaults[selected] || {})) {
    const el = document.getElementById('param-' + k);
    if (typeof v === 'boolean') params[k] = el.checked;
    else if (typeof v === 'number') params[k] = Number(el.value);
    else params[k] = el.value;
  }
  return params;
}

async function run() {
  if (activeJob) return;
  const btn = document.getElementById('run-btn');
  btn.disabled = true; btn.textContent = '求解中…';
  document.getElementById('result-card').style.display = 'none';
  try {
    const job = await api(`/problems/${problem.id}/solve-jobs`, {
      method: 'POST', body: JSON.stringify({ solver: selected, params: collectParams() }),
    });
    activeJob = job;
    showProgressCard();
    renderProgress(job);
    pollTimer = setInterval(pollJob, 500);
  } catch (e) {
    toast(e.message, 'error');
    btn.disabled = false; btn.textContent = '▶ 求解';
  }
}

async function pollJob() {
  if (!activeJob) return;
  let job;
  try {
    job = await api(`/problems/${problem.id}/solve-jobs/${activeJob.id}`);
  } catch (e) {
    // The server only keeps finished jobs in memory for a bounded TTL; after
    // that the live snapshot is gone (the saved solution remains on disk and
    // in the results/history pages).
    if (/not found/i.test(e.message)) {
      clearInterval(pollTimer); pollTimer = null;
      activeJob = null;
      const runBtn = document.getElementById('run-btn');
      runBtn.disabled = false; runBtn.textContent = '▶ 求解';
      document.getElementById('stop-btn').disabled = true;
      document.getElementById('progress-msg').textContent =
        '该任务的实时状态已过期（服务重启或超时），已保存的方案仍可在“结果与目标值”页面查看。';
      return;
    }
    // transient poll failure: leave the timer running, just note it
    document.getElementById('progress-msg').textContent = '刷新进度失败，重试中…';
    return;
  }
  activeJob = job;
  renderProgress(job);
  if (['completed', 'stopped', 'failed'].includes(job.status)) {
    clearInterval(pollTimer); pollTimer = null;
    finishJob(job);
  }
}

async function stopJob() {
  if (!activeJob) return;
  const btn = document.getElementById('stop-btn');
  btn.disabled = true; btn.textContent = '正在停止…';
  try {
    await api(`/problems/${problem.id}/solve-jobs/${activeJob.id}/stop`, { method: 'POST' });
  } catch (e) {
    toast(e.message, 'error');
    btn.disabled = false; btn.textContent = '■ 停止';
  }
}

function finishJob(job) {
  activeJob = null;
  const runBtn = document.getElementById('run-btn');
  runBtn.disabled = false; runBtn.textContent = '▶ 求解';
  const stopBtn = document.getElementById('stop-btn');
  stopBtn.disabled = true; stopBtn.textContent = '■ 停止';
  document.getElementById('pulse').innerHTML = '';

  if (job.status === 'failed') {
    toast(job.error || '求解失败', 'error');
    document.getElementById('progress-msg').textContent = '求解失败：' + (job.error || '');
    return;
  }
  const sol = job.solution;
  showResult(sol);
  if (job.status === 'stopped') {
    toast(`已停止，当前最好解已保存：目标值 ${fmt(sol.objective_value)}`);
  } else {
    toast(`求解完成：目标值 ${fmt(sol.objective_value)}`);
  }
}

/* ---- live progress rendering ------------------------------------------ */
function showProgressCard() {
  document.getElementById('progress-card').style.display = 'block';
  document.getElementById('progress-card').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  document.getElementById('stop-btn').disabled = false;
  document.getElementById('pulse').innerHTML = '<span class="pulse"></span>';
  document.getElementById('progress-title').textContent =
    `求解中 — ${SOLVER_LABELS[selected] || selected}`;
  lastChartPts = 0;
}

const UNIT_LABELS = {
  ip: { unit: '节点', lb: '搜索下界' },
  genetic: { unit: '代', lb: null },
  simulated_annealing: { unit: '次迭代', lb: null },
  lp: { unit: null, lb: 'LP 下界' },
  greedy: { unit: null, lb: null },
};

function renderProgress(job) {
  const p = job.progress;
  const meta = UNIT_LABELS[job.solver] || { unit: null, lb: null };
  const stopping = p.stop_requested && !['completed', 'stopped', 'failed'].includes(job.status);

  // bar: fraction of total work if known, otherwise fraction of time limit
  const track = document.getElementById('progress-track');
  const fill = document.getElementById('progress-fill');
  let frac = p.fraction;
  if (frac == null && p.time_limit) frac = Math.min(1, p.elapsed / p.time_limit);
  if (frac == null) {
    track.classList.add('indeterminate');
    fill.style.width = '';
  } else {
    track.classList.remove('indeterminate');
    fill.style.width = (frac * 100).toFixed(1) + '%';
  }

  // explored counter
  let explored = '—';
  if (meta.unit && (p.current || p.total)) {
    explored = `已探索：${fmt(p.current)}${p.total ? ' / ' + fmt(p.total) : ''} ${meta.unit}`;
  } else if (p.stage) {
    explored = `阶段：${p.stage}`;
  }
  document.getElementById('progress-explored').textContent = explored;

  // ETA
  let eta = '—';
  if (stopping) eta = '正在停止，保存当前最好解…';
  else if (frac != null && frac > 0.02 && p.elapsed > 0.5) {
    const total = p.elapsed / frac;
    eta = `预计剩余 ≈ ${Math.max(0, Math.round(total - p.elapsed))}s`;
  } else if (p.time_limit) {
    eta = `时间上限 ${p.time_limit}s`;
  }
  document.getElementById('progress-eta').textContent = eta;

  document.getElementById('p-best').textContent = fmt(p.best_objective);
  document.getElementById('p-lb').textContent =
    meta.lb === null ? '—' : (p.lower_bound != null ? fmt(p.lower_bound) : '—');
  document.getElementById('p-elapsed').textContent = fmt(p.elapsed, 1) + 's';
  document.getElementById('p-stage').textContent = stopping ? '停止中' : (p.stage || '—');
  document.getElementById('progress-msg').textContent = p.message || '';

  // convergence chart: redraw only when a new improvement point arrived
  if (p.history.length !== lastChartPts) {
    lastChartPts = p.history.length;
    convergenceChart(document.getElementById('convergence'), {
      history: p.history,
      lowerBounds: [],
    });
  }
}

function showResult(sol) {
  document.getElementById('result-card').style.display = 'block';
  document.getElementById('result-body').innerHTML = `
    <div class="grid cols-4">
      <div class="stat"><div class="label">目标值</div><div class="value">${fmt(sol.objective_value)}</div></div>
      <div class="stat"><div class="label">完工时间</div><div class="value">${fmt(sol.makespan)}</div></div>
      <div class="stat"><div class="label">状态</div><div class="value">${statusBadge(sol.status)}</div></div>
      <div class="stat"><div class="label">耗时</div><div class="value">${fmt(sol.solve_time)}s</div></div>
    </div>
    <p class="small muted">${escapeHtml(sol.message || '')} · 方案 <span class="mono">${escapeHtml(sol.id)}</span></p>
    <div class="btn-row">
      <button class="btn" onclick="saveConfig()">保存配置</button>
      <a class="btn" href="gantt.html?id=${encodeURIComponent(problem.id)}&solution=${encodeURIComponent(sol.id)}">查看甘特图</a>
    </div>`;
}

async function saveConfig() {
  await api(`/problems/${problem.id}/configs`, {
    method: 'POST', body: JSON.stringify({ solver: selected, params: collectParams() }),
  });
  toast('配置已保存');
  loadConfigs();
}

async function loadConfigs() {
  const { configs } = await api(`/problems/${problem.id}/configs`).catch(() => ({ configs: [] }));
  document.getElementById('config-rows').innerHTML = configs.map(c => `
    <tr><td class="mono">${escapeHtml(c.id)}</td><td>${escapeHtml(solverLabel(c.solver))}</td>
      <td class="small mono">${escapeHtml(JSON.stringify(c.params))}</td>
      <td><button class="btn sm" onclick='applyConfig(${JSON.stringify(c.params).replace(/'/g, "&#39;")})'>应用</button></td></tr>`).join('')
    || '<tr><td colspan="4" class="empty">暂无已保存的配置。</td></tr>';
}

function applyConfig(params) {
  for (const [k, v] of Object.entries(params)) {
    const el = document.getElementById('param-' + k);
    if (!el) continue;
    if (typeof v === 'boolean') el.checked = v;
    else el.value = v;
  }
  toast('配置已应用');
}

load().catch(e => toast(e.message, 'error'));
</script>
</body>
</html>
