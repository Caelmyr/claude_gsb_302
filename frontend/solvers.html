<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>求解器与参数 — 排程求解系统</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">排程求解系统</div>
    <div class="brand-sub">运筹优化与排程求解</div>
    <nav id="nav"></nav>
    <div class="section-label">问题实例</div>
    <select id="problem-picker"></select>
  </aside>
  <main class="main">
    <div class="page-head">
      <h1>求解器选择与参数</h1>
      <span class="sub">线性 / 整数规划与元启发式算法</span>
    </div>

    <div class="grid cols-3" id="solver-cards"></div>

    <div class="card">
      <div class="flex">
        <h2 style="margin:0" id="param-title">参数</h2>
        <div class="spacer"></div>
        <button class="btn primary" id="run-btn" onclick="run()">▶ 求解</button>
        <button class="btn danger" id="stop-btn" onclick="stop()" style="display:none">■ 停止</button>
      </div>
      <div class="form-grid" id="param-fields"></div>
    </div>

    <div class="card" id="progress-card" style="display:none">
      <div class="flex">
        <h2 style="margin:0">求解进度</h2>
        <div class="spacer"></div>
        <span id="job-status"></span>
      </div>

      <div class="progress-wrap mt">
        <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
        <div class="small muted" id="progress-label">启动中…</div>
      </div>

      <div class="grid cols-4 mt">
        <div class="stat"><div class="label">当前最好目标值</div>
          <div class="value" id="pv-best" style="color:var(--accent)">—</div>
          <div class="hint" id="pv-best-detail"></div></div>
        <div class="stat"><div class="label">下界 / 最优间隙</div>
          <div class="value" id="pv-bound">—</div>
          <div class="hint" id="pv-gap"></div></div>
        <div class="stat"><div class="label">已探索</div>
          <div class="value" id="pv-done">—</div>
          <div class="hint" id="pv-done-hint"></div></div>
        <div class="stat"><div class="label">已用 / 预计剩余</div>
          <div class="value" id="pv-elapsed">—</div>
          <div class="hint" id="pv-eta"></div></div>
      </div>

      <h3 class="mt">当前最好目标值随时间变化</h3>
      <div class="chart-wrap" id="convergence"></div>
      <div class="legend">
        <span><span class="swatch" style="background:#2563eb"></span>当前最好（incumbent）</span>
        <span><span class="swatch" style="background:#9ca3af"></span>下界（如可获得）</span>
      </div>
      <div class="small muted" id="job-error" style="display:none"></div>
    </div>

    <div class="card" id="result-card" style="display:none">
      <h2>求解结果</h2>
      <div id="result-body"></div>
    </div>

    <div class="card">
      <h2>已保存的配置</h2>
      <table><thead><tr><th>ID</th><th>求解器</th><th>参数</th><th></th></tr></thead>
        <tbody id="config-rows"></tbody></table>
    </div>
  </main>
</div>
<script src="js/common.js"></script>
<script src="js/charts.js"></script>
<script>
let problem = null;
let defaults = {};
let selected = 'genetic';

// Live job state
let activeJobId = null;   // job_… being tracked on this page
let pollTimer = null;
let lastChartCount = -1;

initSidebar('solvers.html');

async function load() {
  const id = currentProblemId();
  if (!id) return;
  problem = await api('/problems/' + id);
  const meta = await api('/solvers');
  defaults = meta.defaults;
  renderCards();
  renderParams();
  loadConfigs();
  await reconnectJob();
}

async function reconnectJob() {
  // Prefer a job this page tab started; fall back to the most recent running
  // job for this problem, so a refresh during a long solve keeps showing it.
  const savedId = sessionStorage.getItem(jobKey());
  if (savedId) {
    try {
      const j = await api('/solve-jobs/' + savedId);
      if (j.running) { attachJob(j); return; }
    } catch (_) { /* gone */ }
    sessionStorage.removeItem(jobKey());
  }
  try {
    const { jobs } = await api(`/problems/${problem.id}/solve-jobs`);
    const running = jobs.find(j => j.running);
    if (running) attachJob(running);
  } catch (_) { /* ignore */ }
}

function renderCards() {
  document.getElementById('solver-cards').innerHTML = SOLVER_NAMES.map(n => `
    <div class="card" style="cursor:pointer;margin:0;border-width:2px;${n === selected ? 'border-color:var(--accent)' : ''}"
         onclick="select('${n}')">
      <h2 style="margin:0 0 4px">${escapeHtml(SOLVER_LABELS[n])}</h2>
      <div class="badge info">${n}</div>
      <p class="small muted" style="margin:8px 0 0">${description(n)}</p>
    </div>`).join('');
}

function description(n) {
  return {
    lp: '时间索引模型的线性规划松弛 —— 给出下界并还原出一个可行排程。',
    ip: '基于时间索引模型的精确分支定界求解。',
    genetic: '随机键编码的遗传算法，配合串行 SGS 解码。',
    simulated_annealing: '随机键编码的模拟退火，采用 Metropolis 接受准则。',
    greedy: '基于优先规则的确定性串行 SGS 基线。',
  }[n] || '';
}

function select(n) { selected = n; renderCards(); renderParams(); }

function renderParams() {
  document.getElementById('param-title').textContent = `参数 — ${SOLVER_LABELS[selected]}`;
  const params = defaults[selected] || {};
  const fields = document.getElementById('param-fields');
  fields.innerHTML = '';
  for (const [k, v] of Object.entries(params)) {
    const div = document.createElement('div');
    if (typeof v === 'boolean') {
      div.innerHTML = `<label>${escapeHtml(k)}</label>
        <input type="checkbox" id="param-${k}" ${v ? 'checked' : ''} style="width:auto">`;
    } else if (typeof v === 'number') {
      div.innerHTML = `<label>${escapeHtml(k)}</label>
        <input type="number" id="param-${k}" step="any" value="${v}">`;
    } else {
      div.innerHTML = `<label>${escapeHtml(k)}</label><input id="param-${k}" value="${escapeHtml(v)}">`;
    }
    fields.appendChild(div);
  }
}

function collectParams() {
  const params = {};
  for (const [k, v] of Object.entries(defaults[selected] || {})) {
    const el = document.getElementById('param-' + k);
    if (typeof v === 'boolean') params[k] = el.checked;
    else if (typeof v === 'number') params[k] = Number(el.value);
    else params[k] = el.value;
  }
  return params;
}

async function run() {
  const btn = document.getElementById('run-btn');
  btn.disabled = true;
  try {
    const job = await api(`/problems/${problem.id}/solve-jobs`, {
      method: 'POST', body: JSON.stringify({ solver: selected, params: collectParams() }),
    });
    attachJob(job);
  } catch (e) {
    toast(e.message, 'error');
    btn.disabled = false;
  }
}

async function stop() {
  if (!activeJobId) return;
  const btn = document.getElementById('stop-btn');
  btn.disabled = true; btn.textContent = '正在停止…';
  try {
    await api(`/solve-jobs/${activeJobId}/stop`, { method: 'POST' });
    toast('已请求停止，正在保存当前最好解…');
  } catch (e) {
    toast(e.message, 'error');
    btn.disabled = false; btn.textContent = '■ 停止';
  }
}

/* ---------- live job tracking ---------- */
function attachJob(job) {
  activeJobId = job.id;
  sessionStorage.setItem(jobKey(), job.id);
  document.getElementById('result-card').style.display = 'none';
  document.getElementById('progress-card').style.display = 'block';
  document.getElementById('run-btn').style.display = 'none';
  const stopBtn = document.getElementById('stop-btn');
  stopBtn.style.display = '';
  stopBtn.disabled = false; stopBtn.textContent = '■ 停止';
  lastChartCount = -1;
  renderProgress(job);
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(pollJob, 500);
}

function detachJob() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  sessionStorage.removeItem(jobKey());
  document.getElementById('run-btn').style.display = '';
  document.getElementById('run-btn').disabled = false;
  const stopBtn = document.getElementById('stop-btn');
  stopBtn.style.display = 'none'; stopBtn.disabled = false;
  stopBtn.textContent = '■ 停止';
}

async function pollJob() {
  if (!activeJobId) return;
  let job;
  try {
    job = await api('/solve-jobs/' + activeJobId);
  } catch (e) {
    detachJob();
    activeJobId = null;
    return;
  }
  renderProgress(job);
  if (!job.running) {
    finishJob(job);
  }
}

function jobKey() {
  return `solveJob:${problem ? problem.id : ''}`;
}

const KIND_LABELS = {
  generations: '代', iterations: '次迭代', nodes: '个节点', time: '时间预算',
};

function renderProgress(j) {
  const statusBox = document.getElementById('job-status');
  const statusMap = {
    queued: ['排队中', 'muted'], running: ['求解中…', 'info'],
    succeeded: ['已完成', 'ok'], stopped: ['已停止（已保存当前最好解）', 'warn'],
    failed: ['失败', 'bad'],
  };
  const [label, cls] = statusMap[j.status] || [j.status, 'muted'];
  statusBox.innerHTML = `<span class="badge ${cls}">${label}</span>`;

  // progress bar
  const fill = document.getElementById('progress-fill');
  const pct = j.progress == null ? 0 : Math.round(j.progress * 100);
  fill.style.width = (j.progress == null && !j.running) ? '100%' : pct + '%';
  fill.className = 'progress-fill' + (j.status === 'failed' ? ' bad'
    : j.status === 'stopped' ? ' warn' : '');
  const kindLabel = KIND_LABELS[j.progress_kind] || '';
  let pl;
  if (j.progress == null && j.running) {
    fill.classList.add('indeterminate');
    pl = `已运行 ${fmt(j.elapsed, 1)}s（该阶段无法预估进度）`;
  } else if (j.progress_kind === 'time' || j.progress == null) {
    pl = `已运行 ${fmt(j.elapsed, 1)}s${j.params && j.params.time_limit ? ` / 时限 ${j.params.time_limit}s` : ''}` +
      (j.progress != null ? `（${pct}%）` : '');
  } else {
    pl = `已探索 ${fmt(j.done)} ${kindLabel}${j.total ? ` / 共 ${fmt(j.total)} ${kindLabel}` : ''}（${pct}%）· 已运行 ${fmt(j.elapsed, 1)}s`;
  }
  if (j.phase) pl += ` · 阶段：${escapeHtml(j.phase)}`;
  document.getElementById('progress-label').textContent = pl;

  // stats
  document.getElementById('pv-best').textContent = fmt(j.best);
  document.getElementById('pv-best-detail').textContent = j.detail || '';
  document.getElementById('pv-bound').textContent = j.lower_bound == null ? '—' : fmt(j.lower_bound);
  document.getElementById('pv-gap').textContent = j.gap == null ? '' : `间隙 ${(j.gap * 100).toFixed(2)}%`;
  document.getElementById('pv-done').textContent = fmt(j.done);
  document.getElementById('pv-done-hint').textContent =
    j.metrics && j.metrics.open_nodes != null ? `待探索分支 ${fmt(j.metrics.open_nodes)}`
    : j.metrics && j.metrics.initialised != null ? `初始种群 ${j.metrics.initialised}` : '';
  document.getElementById('pv-elapsed').textContent = fmt(j.elapsed, 1) + 's';
  const eta = computeEta(j);
  document.getElementById('pv-eta').textContent = eta == null ? '' : `预计剩余约 ${eta}`;

  // convergence chart (re-draw only when a new point arrived)
  const n = j.history ? j.history.length : 0;
  if (n !== lastChartCount) {
    convergenceChart(document.getElementById('convergence'), { history: j.history || [] });
    lastChartCount = n;
  }

  const errBox = document.getElementById('job-error');
  if (j.status === 'failed' && j.error) {
    errBox.style.display = '';
    errBox.textContent = '错误：' + j.error;
  } else {
    errBox.style.display = 'none';
  }
}

function computeEta(j) {
  if (!j.running || j.elapsed < 1 || j.progress == null || j.progress <= 0.001) return null;
  const remain = j.elapsed * (1 - j.progress) / j.progress;
  if (!isFinite(remain) || remain <= 0) return null;
  if (remain < 60) return `${Math.ceil(remain)} 秒`;
  return `${Math.ceil(remain / 60)} 分钟`;
}

function finishJob(j) {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  const stopBtn = document.getElementById('stop-btn');
  stopBtn.style.display = 'none';
  document.getElementById('run-btn').style.display = '';
  document.getElementById('run-btn').disabled = false;
  sessionStorage.removeItem(jobKey());

  if (j.status === 'failed') {
    toast(j.error || '求解失败', 'error');
    // Keep the progress panel visible so the error is readable.
    activeJobId = null;
    return;
  }
  // succeeded | stopped -> the solver persisted the incumbent
  const sol = j.solution;
  if (sol) {
    showResult(sol);
    if (j.status === 'stopped') {
      toast(`已停止，当前最好解 ${fmt(sol.objective_value)} 已保存`);
    } else {
      toast(`求解完成：目标值 ${fmt(sol.objective_value)}`);
    }
  }
  activeJobId = null;
}

function showResult(sol) {
  document.getElementById('result-card').style.display = 'block';
  document.getElementById('result-body').innerHTML = `
    <div class="grid cols-4">
      <div class="stat"><div class="label">目标值</div><div class="value">${fmt(sol.objective_value)}</div></div>
      <div class="stat"><div class="label">完工时间</div><div class="value">${fmt(sol.makespan)}</div></div>
      <div class="stat"><div class="label">状态</div><div class="value">${statusBadge(sol.status)}</div></div>
      <div class="stat"><div class="label">耗时</div><div class="value">${fmt(sol.solve_time)}s</div></div>
    </div>
    <p class="small muted">${escapeHtml(sol.message || '')} · 方案 <span class="mono">${escapeHtml(sol.id)}</span></p>
    <div class="btn-row">
      <button class="btn" onclick="saveConfig()">保存配置</button>
      <a class="btn" href="gantt.html?id=${encodeURIComponent(problem.id)}&solution=${encodeURIComponent(sol.id)}">查看甘特图</a>
    </div>`;
}

async function saveConfig() {
  await api(`/problems/${problem.id}/configs`, {
    method: 'POST', body: JSON.stringify({ solver: selected, params: collectParams() }),
  });
  toast('配置已保存');
  loadConfigs();
}

async function loadConfigs() {
  const { configs } = await api(`/problems/${problem.id}/configs`).catch(() => ({ configs: [] }));
  document.getElementById('config-rows').innerHTML = configs.map(c => `
    <tr><td class="mono">${escapeHtml(c.id)}</td><td>${escapeHtml(solverLabel(c.solver))}</td>
      <td class="small mono">${escapeHtml(JSON.stringify(c.params))}</td>
      <td><button class="btn sm" onclick='applyConfig(${JSON.stringify(c.params).replace(/'/g, "&#39;")})'>应用</button></td></tr>`).join('')
    || '<tr><td colspan="4" class="empty">暂无已保存的配置。</td></tr>';
}

function applyConfig(params) {
  for (const [k, v] of Object.entries(params)) {
    const el = document.getElementById('param-' + k);
    if (!el) continue;
    if (typeof v === 'boolean') el.checked = v;
    else el.value = v;
  }
  toast('配置已应用');
}

load().catch(e => toast(e.message, 'error'));
</script>
</body>
</html>
